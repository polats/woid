buildscript {
  ext.kotlin_version = '2.2.21'
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.7.2'
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

ext {
  androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.0'
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
  namespace "com.woid.imagen"
  compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35
  defaultConfig {
    minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35
    ndk { abiFilters 'arm64-v8a' }
  }
  packaging {
    // Don't strip Qualcomm's prebuilt .so files (they're already release-built)
    // and don't compress them in the APK — uncompressed lets dlopen mmap them.
    jniLibs {
      keepDebugSymbols += [
        '**/libQnnHtp.so',
        '**/libQnnHtpV75Stub.so',
        '**/libQnnHtpV75Skel.so',
        '**/libQnnHtpPrepare.so',
        '**/libQnnSystem.so',
        '**/libQnnCpu.so',
      ]
      useLegacyPackaging = true
    }
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_21
    targetCompatibility JavaVersion.VERSION_21
  }
  kotlinOptions {
    jvmTarget = '21'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation project(':capacitor-android')
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
  // ONNX Runtime with QNN Execution Provider bundled. The Qualcomm
  // libQnn*.so files live alongside in jniLibs/arm64-v8a/ (extracted
  // from QAIRT SDK 2.45.0, matching the version Qualcomm AI Hub used
  // to compile the SD context binaries).
  implementation 'com.microsoft.onnxruntime:onnxruntime-android-qnn:1.24.3'
}
